<!doctype html>
<html lang="es-AR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0e0e; --surface: #1a1a1a; --surface-2: #232323;
      --line: #2c2c2c; --line-strong: #3d3d3d;
      --text: #f3efe7; --muted: #a39d93;
      --gold: #d6a84e; --gold-2: #f0c873; --ink: #1a1405;
      --danger: #ff7b6b; --ok: #6fd39a; --wa: #25d366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body { background: var(--bg); color: var(--text); }
    body { font-family: "Manrope", system-ui, sans-serif; font-size: 16px; line-height: 1.45; padding-bottom: 40px; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; }
    a { color: inherit; }

    .top {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; background: rgba(14,14,14,.94); border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .brand { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 900; font-size: 24px; letter-spacing: .06em; }
    .brand span { color: var(--gold); }
    .top-actions { display: flex; gap: 8px; }
    .pill { font-size: 13px; font-weight: 600; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 999px; text-decoration: none; color: var(--muted); }

    .wrap { max-width: 640px; margin: 0 auto; padding: 14px 16px; }

    /* días */
    .days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 12px; margin: 0 -16px; scrollbar-width: none; }
    .days::-webkit-scrollbar { display: none; }
    .day {
      flex: none; width: 58px; padding: 8px 0; border-radius: 14px; text-align: center;
      background: var(--surface); border: 1px solid var(--line);
    }
    .day small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .day b { display: block; font-size: 20px; font-weight: 700; line-height: 1.2; }
    .day i { display: inline-block; min-width: 20px; margin-top: 2px; padding: 0 6px; border-radius: 999px; font-style: normal; font-size: 11px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
    .day i.con { background: var(--gold); color: var(--ink); }
    .day.cerrado { opacity: .45; }
    .day[aria-current="true"] { border-color: var(--gold); background: rgba(214,168,78,.12); }

    .date-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 6px; }
    .date-row h1 { font-family: "Big Shoulders Display", Impact, sans-serif; font-size: 30px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; line-height: 1; text-align: center; flex: 1; }
    .arrow { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-strong); font-size: 22px; line-height: 1; }
    .picker { position: relative; display: block; text-align: center; font-size: 13px; color: var(--gold-2); margin-bottom: 10px; }
    .picker input { position: absolute; inset: 0; opacity: 0; width: 100%; }

    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
    .stat b { display: block; font-size: 18px; }
    .stat small { font-size: 11px; color: var(--muted); }

    /* agenda */
    .agenda { display: grid; gap: 8px; }
    .slot { display: grid; grid-template-columns: 58px 1fr; gap: 10px; align-items: start; }
    .slot.pasado { opacity: .55; }
    .hora { font-weight: 700; font-variant-numeric: tabular-nums; padding-top: 12px; color: var(--muted); }
    .slot .card { min-width: 0; }
    .libre { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 48px; padding: 6px 6px 6px 14px; border: 1px dashed var(--line-strong); border-radius: 12px; color: var(--muted); font-size: 14px; }
    .libre div { display: flex; gap: 6px; }
    .mini { font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--text); }
    .mini.gold { background: var(--gold); color: var(--ink); border-color: var(--gold); }

    .turno { padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 12px; }
    .turno + .turno { margin-top: 6px; }
    .turno.e-confirmado { border-left-color: var(--ok); }
    .turno.e-realizado { border-left-color: #7fb3ff; }
    .turno.e-bloqueado { border-left-color: var(--line-strong); background: var(--surface-2); }
    .turno.inactivo { opacity: .5; border-left-color: var(--danger); }
    .t-head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
    .t-name { font-weight: 700; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
    .t-price { color: var(--gold-2); font-weight: 700; white-space: nowrap; }
    .t-info { font-size: 14px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
    .t-info a { color: var(--gold-2); }
    .t-com { font-size: 14px; margin-top: 6px; padding: 8px 10px; background: var(--bg); border-radius: 8px; }
    .t-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
    .t-actions .wa { background: var(--wa); border-color: var(--wa); color: #06210f; text-decoration: none; }
    .t-actions .call { text-decoration: none; }
    .estado {
      margin-left: auto; min-height: 36px; padding: 6px 30px 6px 12px; border-radius: 999px;
      background: var(--surface-2) url("data:image/svg+xml,%3Csvg xmlns='http:%2F%2Fwww.w3.org%2F2000%2Fsvg' width='10' height='6'%3E%3Cpath fill='%23a39d93' d='M0 0h10L5 6z'/%3E%3C/svg%3E") no-repeat right 12px center;
      border: 1px solid var(--line-strong); appearance: none; -webkit-appearance: none; font-size: 13px; font-weight: 700;
    }

    .empty, .loading { text-align: center; color: var(--muted); padding: 32px 12px; }
    .cerrado-msg { text-align: center; padding: 28px 16px; border: 1px dashed var(--line-strong); border-radius: 14px; color: var(--muted); }
    .cerrado-msg .mini { margin-top: 12px; }

    /* formulario */
    .sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; }
    .sheet-top { position: sticky; top: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
    .sheet-top h2 { font-size: 18px; }
    .back { width: 44px; height: 44px; font-size: 28px; line-height: 1; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .input { width: 100%; min-height: 50px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; font-size: 16px; }
    .input:focus { outline: none; border-color: var(--gold); }
    textarea.input { min-height: 80px; resize: vertical; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { width: 100%; min-height: 54px; border-radius: 14px; background: var(--gold); color: var(--ink); font-weight: 700; font-size: 16px; }
    .btn[disabled] { opacity: .6; }
    .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }

    .toast {
      position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 40;
      transform: translate(-50%, 30px); opacity: 0; pointer-events: none; transition: .25s;
      max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 12px;
      background: #f3efe7; color: #111; font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: var(--danger); }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">ZETAS <span>TURNOS</span></div>
    <div class="top-actions">
      <button id="actualizar" class="pill" type="button">Actualizar</button>
      <a id="verSitio" class="pill" target="_blank" rel="noopener" hidden>Ver página</a>
    </div>
  </header>

  <main class="wrap">
    <nav id="dias" class="days" aria-label="Próximos días"></nav>
    <div class="date-row">
      <button class="arrow" type="button" data-mover="-1" aria-label="Día anterior">‹</button>
      <h1 id="titulo">Cargando…</h1>
      <button class="arrow" type="button" data-mover="1" aria-label="Día siguiente">›</button>
    </div>
    <label class="picker">Elegir otra fecha<input id="fecha" type="date" aria-label="Elegir otra fecha"></label>
    <section id="resumen" class="summary"></section>
    <section id="agenda" class="agenda"><p class="loading">Cargando turnos…</p></section>
  </main>

  <!-- Nuevo turno / bloqueo -->
  <section id="form" class="sheet" hidden>
    <div class="sheet-top">
      <button class="back" type="button" id="cerrarForm" aria-label="Volver">‹</button>
      <h2 id="formTitulo">Nuevo turno</h2>
    </div>
    <div class="wrap">
      <div class="grid-2">
        <div class="field">
          <label for="fHora">Hora</label>
          <input id="fHora" class="input" type="time" step="300">
        </div>
        <div class="field">
          <label for="fPrecio">Precio</label>
          <input id="fPrecio" class="input" type="text" inputmode="numeric" placeholder="8000">
        </div>
      </div>
      <div id="camposTurno">
        <div class="field">
          <label for="fNombre">Nombre</label>
          <input id="fNombre" class="input" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label for="fTel">Teléfono</label>
          <input id="fTel" class="input" type="tel" inputmode="tel" autocomplete="off">
        </div>
        <div class="field">
          <label for="fInsta">Instagram (opcional)</label>
          <input id="fInsta" class="input" type="text" autocomplete="off" autocapitalize="none" placeholder="@usuario">
        </div>
        <div class="field">
          <label for="fServicio">Servicio</label>
          <select id="fServicio" class="input"></select>
        </div>
        <div class="field">
          <label for="fDir">Dirección (si es a domicilio)</label>
          <input id="fDir" class="input" type="text" autocomplete="off">
        </div>
      </div>
      <div class="field">
        <label for="fCom">Comentarios</label>
        <textarea id="fCom" class="input"></textarea>
      </div>
      <button id="guardar" class="btn" type="button">Guardar turno</button>
      <p class="hint" id="formHint"></p>
    </div>
  </section>

  <div id="toast" class="toast" role="status"></div>

<script>
  /* Importante: Apps Script borra lo que sigue a dos barras seguidas dentro del script
     (también en textos), así que no hay comentarios de línea y los links llevan barras escapadas. */
  window.addEventListener("error", e => {
    const a = document.getElementById("agenda");
    if (a) a.innerHTML = `<p class="empty">Hubo un error en el panel: ${String(e.message).replace(/</g, "&lt;")}</p>`;
  });

  const $ = s => document.querySelector(s);
  const DIAS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  const DIAS_LARGO = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
  const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  const INACTIVOS = ["cancelado", "cancelada", "anulado", "no vino"];
  const state = { iso: null, datos: null, ocupado: false, bloquear: false };

  const server = (fn, ...args) => new Promise((ok, fail) =>
    google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](...args));

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pesos = n => "$" + Number(n || 0).toLocaleString("es-AR");
  const pad = n => String(n).padStart(2, "0");
  const isoADate = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
  const dateAIso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const sumar = (iso, n) => { const d = isoADate(iso); d.setDate(d.getDate() + n); return dateAIso(d); };
  const isoATexto = iso => iso.split("-").reverse().join("/");
  const activo = e => !INACTIVOS.includes(String(e || "").trim().toLowerCase());
  const claseEstado = e => "e-" + String(e).toLowerCase().replace(/\s+/g, "-");

  function toast(msg, error) {
    const t = $("#toast");
    t.textContent = msg; t.classList.toggle("error", !!error); t.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600);
  }

  /* Teléfono argentino a formato de WhatsApp (549 + área + número). */
  function waNumero(tel) {
    let d = String(tel || "").replace(/\D/g, "");
    if (d.startsWith("549")) return d;
    if (d.startsWith("54")) d = d.slice(2);
    if (d.startsWith("0")) d = d.slice(1);
    if (d.length === 12 && d.startsWith("1115")) d = "11" + d.slice(4);
    if (d.length === 8) d = "11" + d;
    return d.length === 10 ? "549" + d : d;
  }

  async function cargar(iso) {
    state.iso = iso || state.iso;
    $("#agenda").innerHTML = `<p class="loading">Cargando turnos…</p>`;
    try {
      state.datos = await server("panelDia", state.iso || "");
      state.iso = state.datos.iso;
      pintar();
    } catch (err) {
      $("#agenda").innerHTML = `<p class="empty">${esc(err.message || err)}</p>`;
    }
  }

  function pintar() {
    const d = state.datos;
    const fecha = isoADate(d.iso);
    const titulo = d.iso === d.hoy ? "Hoy" : d.iso === sumar(d.hoy, 1) ? "Mañana" : DIAS_LARGO[fecha.getDay()];
    $("#titulo").textContent = `${titulo} ${fecha.getDate()} ${MESES[fecha.getMonth()]}`;
    $("#fecha").value = d.iso;
    if (d.sitio) { $("#verSitio").href = d.sitio; $("#verSitio").hidden = false; }

    $("#dias").innerHTML = d.proximos.map(p => {
      const f = isoADate(p.iso);
      return `<button class="day ${p.abierto ? "" : "cerrado"}" type="button" data-iso="${p.iso}" aria-current="${p.iso === d.iso}">
        <small>${p.iso === d.hoy ? "hoy" : DIAS[f.getDay()]}</small><b>${f.getDate()}</b><i class="${p.cantidad ? "con" : ""}">${p.cantidad}</i></button>`;
    }).join("");
    const actual = $(`.day[data-iso="${d.iso}"]`);
    if (actual) actual.scrollIntoView({ inline: "center", block: "nearest" });

    const activos = d.turnos.filter(t => activo(t.estado) && t.estado !== "Bloqueado");
    const previsto = activos.reduce((s, t) => s + t.precio, 0);
    const cobrado = d.turnos.filter(t => t.estado === "Realizado").reduce((s, t) => s + t.precio, 0);
    $("#resumen").innerHTML = `
      <div class="stat"><b>${activos.length}</b><small>turnos</small></div>
      <div class="stat"><b>${pesos(previsto)}</b><small>previsto</small></div>
      <div class="stat"><b>${pesos(cobrado)}</b><small>cobrado</small></div>`;

    const horas = [...new Set([...d.grilla, ...d.turnos.map(t => t.hora)])].sort();
    if (!horas.length) {
      $("#agenda").innerHTML = `<div class="cerrado-msg">Este día no atendés.<br><button class="mini" type="button" data-nuevo="12:00">+ Agregar turno igual</button></div>`;
      return;
    }
    const pasadoHasta = d.iso < d.hoy ? "99:99" : d.iso === d.hoy ? d.ahora : "";
    $("#agenda").innerHTML = horas.map(h => {
      const ts = d.turnos.filter(t => t.hora === h);
      const ocupado = ts.some(t => activo(t.estado));
      const libre = ocupado ? "" : `<div class="libre"><span>Libre</span><div>
          <button class="mini" type="button" data-bloquear="${h}">Bloquear</button>
          <button class="mini gold" type="button" data-nuevo="${h}">+ Turno</button></div></div>`;
      return `<div class="slot ${pasadoHasta && h < pasadoHasta ? "pasado" : ""}">
        <div class="hora">${h}</div><div class="card">${ts.map(tarjeta).join("")}${libre}</div></div>`;
    }).join("");
  }

  function tarjeta(t) {
    if (t.estado === "Bloqueado") {
      return `<div class="turno e-bloqueado"><div class="t-head"><span class="t-name">Bloqueado</span>
        <button class="mini" type="button" data-fila="${t.fila}" data-hora="${t.hora}" data-estado="Cancelado">Liberar</button></div>
        ${t.comentarios ? `<p class="t-info">${esc(t.comentarios)}</p>` : ""}</div>`;
    }
    const wa = waNumero(t.telefono);
    const fecha = isoADate(state.iso);
    const msg = `¡Hola ${t.nombre.split(" ")[0]}! Te escribo de Zetas Barber para recordarte tu turno del ${DIAS_LARGO[fecha.getDay()].toLowerCase()} ${t.fecha} a las ${t.hora}. ¡Te esperamos!`;
    const mapa = t.direccion ? "https:\/\/www.google.com\/maps\/search\/?api=1&query=" + encodeURIComponent(t.direccion) : "";
    const opciones = state.datos.estados.map(e => `<option ${e === t.estado ? "selected" : ""}>${e}</option>`).join("");
    return `<article class="turno ${claseEstado(t.estado)} ${activo(t.estado) ? "" : "inactivo"}">
      <div class="t-head"><span class="t-name">${esc(t.nombre)}</span><span class="t-price">${pesos(t.precio)}</span></div>
      <p class="t-info">${esc(t.servicio)}${t.telefono ? " · " + esc(t.telefono) : ""}</p>
      ${t.instagram ? `<p class="t-info">Instagram: <a href="https:\/\/instagram.com\/${encodeURIComponent(t.instagram)}" target="_blank" rel="noopener">@${esc(t.instagram)}</a></p>` : ""}
      ${t.direccion ? `<p class="t-info">📍 <a href="${mapa}" target="_blank" rel="noopener">${esc(t.direccion)}</a>${t.km !== "" ? ` (${t.km} km)` : ""}</p>` : ""}
      ${t.comentarios ? `<p class="t-com">${esc(t.comentarios)}</p>` : ""}
      <div class="t-actions">
        ${wa ? `<a class="mini wa" target="_blank" rel="noopener" href="https:\/\/wa.me\/${wa}?text=${encodeURIComponent(msg)}">WhatsApp</a>
        <a class="mini call" href="tel:${esc(t.telefono)}">Llamar</a>` : ""}
        <select class="estado" aria-label="Estado del turno de ${esc(t.nombre)}" data-fila="${t.fila}" data-hora="${t.hora}">${opciones}</select>
      </div></article>`;
  }

  async function cambiarEstado(fila, hora, estado) {
    if (state.ocupado) return;
    state.ocupado = true;
    try {
      await server("cambiarEstado", Number(fila), isoATexto(state.iso), hora, estado);
      toast(estado === "Cancelado" ? "Horario liberado" : "Estado: " + estado);
      await cargar();
    } catch (err) {
      toast(err.message || String(err), true);
      await cargar();
    } finally { state.ocupado = false; }
  }

  /* ---------- formulario ---------- */
  function abrirForm(hora, bloquear) {
    state.bloquear = bloquear;
    $("#formTitulo").textContent = bloquear ? "Bloquear horario" : "Nuevo turno";
    $("#camposTurno").hidden = bloquear;
    $("#fPrecio").closest(".field").hidden = bloquear;
    $("#guardar").textContent = bloquear ? "Bloquear horario" : "Guardar turno";
    $("#fHora").value = hora;
    ["#fNombre", "#fTel", "#fInsta", "#fDir", "#fCom"].forEach(s => $(s).value = "");
    $("#fCom").placeholder = bloquear ? "Motivo (opcional): trámite, almuerzo…" : "";
    $("#fServicio").innerHTML = state.datos.servicios.map(([n, p]) => `<option value="${esc(n)}" data-precio="${p}">${esc(n)}</option>`).join("");
    $("#fPrecio").value = state.datos.servicios[0][1];
    const f = isoADate(state.iso);
    $("#formHint").textContent = `${DIAS_LARGO[f.getDay()]} ${isoATexto(state.iso)}`;
    $("#form").hidden = false;
    window.scrollTo(0, 0);
    if (!bloquear) $("#fNombre").focus();
  }

  async function guardar() {
    const d = {
      fecha: state.iso,
      hora: $("#fHora").value,
      comentarios: $("#fCom").value.trim(),
      bloquear: state.bloquear
    };
    if (state.bloquear) {
      Object.assign(d, { nombre: "Bloqueado", servicio: "Bloqueo", telefono: "", precio: 0 });
    } else {
      Object.assign(d, {
        nombre: $("#fNombre").value.trim(),
        telefono: $("#fTel").value.trim(),
        instagram: $("#fInsta").value.trim(),
        servicio: $("#fServicio").value,
        direccion: $("#fDir").value.trim(),
        precio: Number(String($("#fPrecio").value).replace(/\D/g, "")) || 0
      });
      if (!d.nombre || !d.telefono) return toast("Completá nombre y teléfono", true);
    }
    if (!/^\d{2}:\d{2}$/.test(d.hora)) return toast("Elegí la hora", true);
    const b = $("#guardar"); b.disabled = true;
    try {
      await server("agregarTurnoPanel", d);
      $("#form").hidden = true;
      toast(state.bloquear ? "Horario bloqueado" : "Turno guardado");
      await cargar();
    } catch (err) {
      toast(err.message || String(err), true);
    } finally { b.disabled = false; }
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click", e => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.iso) return cargar(t.dataset.iso);
    if (t.dataset.mover) return cargar(sumar(state.iso, Number(t.dataset.mover)));
    if (t.dataset.nuevo) return abrirForm(t.dataset.nuevo, false);
    if (t.dataset.bloquear) return abrirForm(t.dataset.bloquear, true);
    if (t.dataset.estado) return cambiarEstado(t.dataset.fila, t.dataset.hora, t.dataset.estado);
  });
  document.addEventListener("change", e => {
    if (e.target.matches("select.estado")) cambiarEstado(e.target.dataset.fila, e.target.dataset.hora, e.target.value);
  });
  $("#fecha").addEventListener("change", e => { if (e.target.value) cargar(e.target.value); });
  $("#fServicio").addEventListener("change", e => { $("#fPrecio").value = e.target.selectedOptions[0].dataset.precio; });
  $("#actualizar").addEventListener("click", () => cargar());
  $("#cerrarForm").addEventListener("click", () => { $("#form").hidden = true; });
  $("#guardar").addEventListener("click", guardar);

  cargar("");
</script>
</body>
</html>
